{% extends "main/base.html" %}{% block title %}FAQ & Help{% endblock %}
{% block content %}<section class="page-head"><div class="container"><span class="eyebrow">FAQ & HELP CENTER</span><h1>Questions, answered.</h1><p>Quick answers about AVERA's purpose and support features.</p></div></section><section class="section pt-4"><div class="container narrow">{% for item in items %}<div class="faq-item"><button class="faq-q" type="button">{{ item.question }} <i class="bi bi-plus"></i></button><div class="faq-a">{{ item.answer|linebreaks }}</div></div>{% empty %}<p>No FAQs yet.</p>{% endfor %}</div></section>{% endblock %}
